name: env-map product head

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: env-map-product-head-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  env-map-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Audit grok EnvMap product head
        run: python3 -m unittest -v tests/test_env_map_product_head.py
