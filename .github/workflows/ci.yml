name: Rust CLI and MCP contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "19 8 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  PRODUCT_SHA: a5e868acc0206fa9c3e91b5e36e0b1b111805885

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ci.yml
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
            vendor/declarative-postgres-migrate.rs -> target
      - name: Bootstrap canonical formatting and strictly lint every Rust target
        run: |
          cargo fmt --all
          cargo clippy --locked --all-targets -- -D warnings
      - name: Run unit, stdio, and compile-fail contracts
        run: |
          cargo test --locked --all-targets
          cargo test --locked --doc
      - name: Validate repository and immutable product pin
        run: cargo run --locked --bin repository-check
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Build the exact pinned dpm product
        id: dpm
        shell: bash
        run: echo "path=$(scripts/build-dpm.sh)" >> "$GITHUB_OUTPUT"
      - name: Build the Rust adapter and certification binaries
        run: cargo build --locked --bins
      - name: Exercise the real CLI and guarded JSON-RPC adapter
        env:
          DPM_BIN: ${{ steps.dpm.outputs.path }}
          DPM_ADAPTER_BIN: ${{ github.workspace }}/target/debug/dpm-mcp-adapter
          POSTGRES_ADMIN_URL: postgres://postgres@localhost:5432/postgres
        run: cargo run --locked --bin contract-certify
      - name: Upload exact-head contract evidence and formatted bootstrap sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-cli-mcp-contract-evidence
          path: |
            artifacts
            Cargo.lock
            src
            tests
          retention-days: 14
          if-no-files-found: error
