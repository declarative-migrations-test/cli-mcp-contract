[package]
name = "cli-mcp-contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "Exact-head Rust certification for the dpm CLI and guarded MCP adapter contract"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "dpm-mcp-adapter"
path = "src/bin/dpm-mcp-adapter.rs"

[[bin]]
name = "repository-check"
path = "src/bin/repository-check.rs"

[[bin]]
name = "contract-certify"
path = "src/bin/contract-certify.rs"

[lints.rust]
unsafe_code = "forbid"
